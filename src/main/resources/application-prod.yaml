server:
  port: 8080

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

  jpa:
    properties:
      hibernate:
        format_sql: false

management:
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false

logging:
  level:
    com.sprint.mission.discodeit: info
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info